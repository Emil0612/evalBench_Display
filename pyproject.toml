[project]
name = "evalbench"
version = "0.1.0"
description = "Does a language model remember the market? Memorization tests for LLMs on Nordic stock prices, indices and news"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "altair>=5.4",
]

[project.scripts]
evalbench-ui = "evalbench.launch:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
